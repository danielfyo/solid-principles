# Keeps every toolchain's dependencies up to date with weekly, grouped pull requests.
# Commit messages follow Conventional Commits: "build(deps): ..." / "ci(deps): ...".
version: 2

updates:
  - package-ecosystem: nuget
    directory: /dotnet
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: build, include: scope }
    groups:
      dotnet:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /python
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: build, include: scope }
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /go
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: build, include: scope }

  - package-ecosystem: npm
    directory: /typescript
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: build, include: scope }
    groups:
      typescript:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /react
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: build, include: scope }
    groups:
      react:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: ci, include: scope }
    groups:
      actions:
        patterns: ["*"]
