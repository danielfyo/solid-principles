name: Improvement or new content
description: Suggest a clearer explanation, a new example, an exercise or a new language.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to add or improve?
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Why does it help learners?
    validations:
      required: true
  - type: checkboxes
    id: equivalence
    attributes:
      label: Equivalence
      options:
        - label: I understand that new examples must be implemented in all five languages.
          required: true
