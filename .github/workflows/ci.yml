name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: dotnet } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - run: dotnet test --configuration Release --collect:"XPlat Code Coverage" --results-directory coverage
      - name: Coverage summary
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator -reports:"coverage/**/coverage.cobertura.xml" -targetdir:coverage/report -reporttypes:MarkdownSummaryGithub
          { echo "## .NET coverage"; cat coverage/report/SummaryGithub.md; } >> "$GITHUB_STEP_SUMMARY"

  python:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: python } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: mypy
      - run: pytest --cov
      - name: Coverage summary
        run: |
          { echo "## Python coverage"; coverage report --format=markdown; } >> "$GITHUB_STEP_SUMMARY"

  go:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: go } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -coverpkg=./... -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: |
          { echo "## Go coverage"; echo '```'; go tool cover -func=coverage.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  typescript:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: typescript } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: typescript/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run coverage
      - name: Coverage summary
        run: |
          { echo "## TypeScript coverage"; echo '```'; cat coverage/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  react:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: react } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: react/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run build
      - name: Coverage summary
        run: |
          { echo "## React coverage"; echo '```'; cat coverage/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/sync_readme.py --check
